      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="1" stop-color="#121a3e"/>
    </linearGradient>
    <radialGradient id="g" cx="0.95" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
