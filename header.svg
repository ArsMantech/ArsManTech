<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="ArsManTech, backend developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="1" stop-color="#121a3e"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.86" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.08" cy="1.05" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#6b7bc4" fill-opacity="0.22"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .label { font-size: 13px; letter-spacing: 4px; fill: #22d3ee; }
    .name  { font-size: 60px; font-weight: 700; fill: url(#name); }
    .sub   { font-size: 17px; fill: #8b97b8; }
    .t     { font-size: 15px; fill: #c7d2fe; }
    .p     { fill: #22d3ee; }
    .dim   { fill: #5b6694; font-size: 12px; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .a1 { animation: show .01s 0.4s both; }
    .a2 { animation: show .01s 0.9s both; }
    .a3 { animation: show .01s 1.5s both; }
    .a4 { animation: show .01s 2.0s both; }
    .a5 { animation: show .01s 2.6s both; }
    .cur { animation: blink 1.1s steps(1) infinite; }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#dots)"/>
    <rect width="1000" height="300" fill="url(#g1)"/>
    <rect width="1000" height="300" fill="url(#g2)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="17.5" fill="none" stroke="#2a3463" stroke-opacity="0.8"/>

  <text x="48" y="108" class="label">BACKEND DEVELOPER</text>
  <text x="46" y="172" class="name">ArsManTech</text>
  <rect x="48" y="192" width="96" height="3" rx="1.5" fill="url(#line)"/>
  <text x="48" y="232" class="sub">APIs, data layers, automation.</text>

  <g transform="translate(580 38)">
    <rect width="372" height="224" rx="12" fill="#0a1022" fill-opacity="0.85" stroke="#2a3463"/>
    <circle cx="20" cy="20" r="4.5" fill="#3a4576"/>
    <circle cx="38" cy="20" r="4.5" fill="#3a4576"/>
    <circle cx="56" cy="20" r="4.5" fill="#3a4576"/>
    <text x="352" y="24" text-anchor="end" class="dim">~/arsmantech</text>
    <line x1="0" y1="40" x2="372" y2="40" stroke="#2a3463" stroke-opacity="0.7"/>

    <text x="24" y="78" class="t a1"><tspan class="p">$</tspan> whoami</text>
    <text x="24" y="102" class="t a2" fill-opacity="0.75">arsmantech</text>
    <text x="24" y="134" class="t a3"><tspan class="p">$</tspan> cat stack.txt</text>
    <text x="24" y="158" class="t a4" fill-opacity="0.75">typescript · nestjs · postgresql</text>
    <text x="24" y="190" class="t a5"><tspan class="p">$</tspan> <tspan class="cur">▍</tspan></text>
  </g>
</svg>
