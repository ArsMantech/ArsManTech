<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace" role="img" aria-label="ArsManTech, backend developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="1" stop-color="#121a3e"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.86" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.08" cy="1.05" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="46" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="144" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#6b7bc4" fill-opacity="0.22"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#dots)"/>
    <rect width="1000" height="300" fill="url(#g1)"/>
    <rect width="1000" height="300" fill="url(#g2)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="17.5" fill="none" stroke="#2a3463" stroke-opacity="0.8"/>

  <text x="48" y="108" font-size="13" letter-spacing="4" fill="#22d3ee">BACKEND DEVELOPER</text>
  <text x="46" y="172" font-size="60" font-weight="700" fill="url(#name)">ArsManTech</text>
  <rect x="48" y="192" width="96" height="3" rx="1.5" fill="url(#line)"/>
  <text x="48" y="232" font-size="17" fill="#8b97b8">APIs, data layers, automation.</text>

  <g transform="translate(580 38)">
    <rect width="372" height="224" rx="12" fill="#0a1022" fill-opacity="0.85" stroke="#2a3463"/>
    <circle cx="20" cy="20" r="4.5" fill="#3a4576"/>
    <circle cx="38" cy="20" r="4.5" fill="#3a4576"/>
    <circle cx="56" cy="20" r="4.5" fill="#3a4576"/>
    <text x="352" y="24" text-anchor="end" font-size="12" fill="#5b6694">~/arsmantech</text>
    <line x1="0" y1="40" x2="372" y2="40" stroke="#2a3463" stroke-opacity="0.7"/>

    <text x="24" y="78" font-size="15" fill="#c7d2fe"><tspan fill="#22d3ee">$</tspan> whoami</text>
    <text x="24" y="102" font-size="15" fill="#c7d2fe" fill-opacity="0.75">arsmantech</text>
    <text x="24" y="134" font-size="15" fill="#c7d2fe"><tspan fill="#22d3ee">$</tspan> cat stack.txt</text>
    <text x="24" y="158" font-size="15" fill="#c7d2fe" fill-opacity="0.75">typescript, nestjs, postgresql</text>
    <text x="24" y="190" font-size="15" fill="#22d3ee">$</text>
    <rect x="42" y="177" width="9" height="16" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
