<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120" role="img" aria-label="ArsManTech, backend developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .name { font: 600 34px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .sub  { font: 400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #656d76; }
    .acc  { fill: #8b5cf6; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #e6edf3; }
      .sub  { fill: #8b949e; }
      .acc  { fill: #a78bfa; }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
  </style>
  <text x="4" y="52" class="name">ArsManTech<tspan class="acc cursor">_</tspan></text>
  <rect x="4" y="68" width="64" height="3" rx="1.5" class="acc"/>
  <text x="4" y="100" class="sub">backend developer · typescript · nestjs · postgresql</text>
</svg>
